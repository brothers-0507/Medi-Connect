{% extends 'base.html' %}

{% block title %}Authentication - MediConnect{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 4rem auto; width: 100%;">
    <div class="card" style="padding: 2.5rem;">
        <div class="tabs" style="margin-bottom: 2rem; justify-content: center; border-bottom: none; gap: 2rem;">
            <button class="tab-btn active" id="login-tab" onclick="switchAuth('login')">
                <i class="ph-bold ph-lock-key" style="margin-right: 0.25rem;"></i> LOG IN
            </button>
            <button class="tab-btn" id="register-tab" onclick="switchAuth('register')">
                <i class="ph-bold ph-user-plus" style="margin-right: 0.25rem;"></i> REGISTER
            </button>
        </div>

        <!-- Login Form -->
        <form id="login-form" action="{{ url_for('login') }}" method="POST" style="animation: fadeIn 0.3s ease;">
            <div class="form-group">
                <label for="login-username">Username</label>
                <input type="text" id="login-username" name="username" class="form-control" required>
            </div>
            <div class="form-group" style="margin-bottom: 2rem;">
                <label for="login-password">Password</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input type="password" id="login-password" name="password" class="form-control" required style="padding-right: 2.5rem;">
                    <button type="button" onclick="togglePasswordVisibility('login-password', this)" style="position: absolute; right: 1rem; background: transparent; border: none; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; padding: 0;">
                        <i class="ph-bold ph-eye" style="font-size: 1.2rem;"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.9rem;">
                <i class="ph-bold ph-sign-in"></i> Sign In
            </button>
            <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
                Don't have an account? <a href="#" onclick="switchAuth('register'); event.preventDefault();">Create one here</a>.
            </div>
        </form>

        <!-- Register Form -->
        <form id="register-form" action="{{ url_for('register') }}" method="POST" style="display: none; animation: fadeIn 0.3s ease;">
            <div class="form-group">
                <label for="reg-username">Username</label>
                <input type="text" id="reg-username" name="username" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="reg-password">Password</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input type="password" id="reg-password" name="password" class="form-control" required style="padding-right: 2.5rem;">
                    <button type="button" onclick="togglePasswordVisibility('reg-password', this)" style="position: absolute; right: 1rem; background: transparent; border: none; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; padding: 0;">
                        <i class="ph-bold ph-eye" style="font-size: 1.2rem;"></i>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label for="reg-name">Full Name / Business Name</label>
                <input type="text" id="reg-name" name="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="reg-role">Account Type</label>
                <select id="reg-role" name="role" class="form-control" style="background-color: #12131e; color: white;" required>
                    <option value="patient">Patient (Medi-Tracker & Broadcaster)</option>
                    <option value="doctor">Doctor (Digital Prescription Creator)</option>
                    <option value="pharmacy">Pharmacy (Stock Management & Quote Bidder)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="reg-contact">Contact Number / Email</label>
                <input type="text" id="reg-contact" name="contact" class="form-control" required>
            </div>
            <div class="form-group" style="margin-bottom: 2rem;">
                <label for="reg-location">Location (City/Town)</label>
                <input type="text" id="reg-location" name="location" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-secondary" style="width: 100%; padding: 0.9rem;">
                <i class="ph-bold ph-user-plus"></i> Create Account
            </button>
            <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
                Already have an account? <a href="#" onclick="switchAuth('login'); event.preventDefault();">Log in here</a>.
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function switchAuth(mode) {
        const loginForm = document.getElementById('login-form');
        const regForm = document.getElementById('register-form');
        const loginTab = document.getElementById('login-tab');
        const regTab = document.getElementById('register-tab');

        if (mode === 'login') {
            loginForm.style.display = 'block';
            regForm.style.display = 'none';
            loginTab.classList.add('active');
            regTab.classList.remove('active');
        } else {
            loginForm.style.display = 'none';
            regForm.style.display = 'block';
            loginTab.classList.remove('active');
            regTab.classList.add('active');
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        const action = urlParams.get('action');
        const role = urlParams.get('role');
        
        if (action === 'register') {
            switchAuth('register');
        }
        
        if (role) {
            // Auto-select role dropdown in registration
            const roleSelect = document.getElementById('reg-role');
            if (roleSelect) {
                roleSelect.value = role;
            }
            
            // Show custom portal welcome message inside form
            const welcomeText = document.createElement('div');
            welcomeText.style.textAlign = 'center';
            welcomeText.style.marginBottom = '1.5rem';
            welcomeText.style.fontSize = '0.9rem';
            welcomeText.style.fontWeight = '600';
            welcomeText.style.textTransform = 'uppercase';
            welcomeText.style.letterSpacing = '0.05em';
            
            if (role === 'doctor') {
                welcomeText.innerHTML = '<span style="color: var(--primary);"><i class="ph-bold ph-stethoscope"></i> Practitioner Portal</span>';
            } else if (role === 'patient') {
                welcomeText.innerHTML = '<span style="color: var(--secondary);"><i class="ph-bold ph-user"></i> Patient Personal Space</span>';
            } else if (role === 'pharmacy') {
                welcomeText.innerHTML = '<span style="color: var(--accent);"><i class="ph-bold ph-first-aid"></i> Pharmacy Network Portal</span>';
            }
            
            const cardElement = document.querySelector('.card');
            if (cardElement) {
                cardElement.insertBefore(welcomeText, cardElement.children[1]);
            }
        }
    });

    function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'ph-bold ph-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'ph-bold ph-eye';
        }
    }
</script>
{% endblock %}
